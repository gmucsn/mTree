<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mTree - Subject Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --gmu-green: #006633;
            --gmu-dark-green: #005239;
            --gmu-gold: #FFCC33;
        }

        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            background-color: var(--gmu-green);
            color: white;
            text-align: center;
            padding: 1.8rem 1rem;
        }

        .card-header h2 {
            margin: 0;
            font-weight: 600;
        }

        .btn-login {
            background-color: var(--gmu-green);
            border: none;
            padding: 12px;
            font-weight: 600;
            width: 100%;
        }

        .btn-login:hover {
            background-color: var(--gmu-dark-green);
        }

        .form-control:focus {
            border-color: var(--gmu-green);
            box-shadow: 0 0 0 0.25rem rgba(0, 102, 51, 0.25);
        }

        .logo {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="login-card card">
        
        <!-- Header -->
        <div class="card-header">
            <div class="logo">
                <i class="bi bi-tree-fill"></i>
            </div>
            <h2>mTree</h2>
            <p class="mb-0 opacity-90">from George Mason University's CEL</p>
        </div>

        <div class="card-body p-4">
            <h4 class="text-center mb-4">Subject Login</h4>
            
            <p class="text-center text-muted mb-4">
                Please enter the Subject ID you were provided to participate in this experiment.
            </p>

            <form action="/subject/subject_sign_in" method="POST">
              {% if error is defined %}
                <div class="mb-3">
                  ENSURE YOU ARE ENTERING THE CORRECT SUBJECT ID
                </div>
              
              {% endif %}
                <div class="mb-4">
                    <label for="subject_id" class="form-label fw-semibold">Subject ID</label>
                    <input 
                        type="text" 
                        class="form-control form-control-lg" 
                        id="subject_id" 
                        name="subject_id"
                        placeholder="Enter your Subject ID"
                        required 
                        autofocus>
                </div>

                <button type="submit" class="btn btn-login btn-lg text-white">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Enter Experiment
                </button>
            </form>
        </div>

        <div class="card-footer text-center py-3 text-muted">
            <small>Research</small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
   
</body>
</html>
