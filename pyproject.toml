[project]
name = "mTree"
version = "2.0.2.dev1"
requires-python = ">=3.13"
dependencies = [
    "bump-my-version>=1.3.0",
    "dill>=0.4.1",
    "dnspython>=2.8.0",
    "fastapi>=0.119.1",
    "fastapi-sio>=0.7.0",
    "isort>=8.0.1",
    "jsonschema>=4.26.0",
    "markdown>=3.10.2",
    "pdoc>=16.0.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pydantic-yaml>=1.6.0",
    "pyfiglet>=1.0.4",
    "pytest>=9.0.3",
    "python-json-logger>=4.1.0",
    "python-multipart>=0.0.28",
    "python-socketio>=5.16.1",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "requests>=2.34.2",
    "setproctitle>=1.3.7",
    "simple-term-menu>=1.6.6",
    "sympy>=1.14.0",
    "terminaltables>=3.1.10",
    "textual>=8.2.6",
    "thespian>=4.0.1",
    "towncrier>=25.8.0",
    "typer>=0.25.1",
    "uvicorn>=0.34.3",
    "websocket-client>=1.9.0",
]
authors = [
  {name = "GMU CEELAB", email = "mtree.email@gmail.com"}
]
maintainers = [
  {name = "GMU CEELAB", email = "mtree.email@gmail.com"}
]
description = "The mTree Computational Microeconomics Package"
readme = "README.md"
license = "MIT"
keywords = ["computational experimental economics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

[project.urls]
Homepage = "https://mtree.readthedocs.io/"
Documentation = "https://mtree.readthedocs.io/"
Repository = "https://github.com/gmucsn/mTree"
"Bug Tracker" = "https://github.com/gmucsn/mTree/issues"
Changelog = "https://github.com/gmucsn/mTree/master/CHANGELOG.md"

[project.scripts]
mTree_developer_server = "mTree.scripts.mTree_developer_server:main"
mTree_runner = "mTree.utilities.mTree_runner:app"
mTree_console = "mTree.utilities.mtree_console:main"
mTree_cli = "mTree.utilities.mtree_cli:app"

[build-system]
requires = ["uv_build>=0.11.17,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mTree"
module-root = "src"

[tool.uv]
package = true

[tool.uv.workspace]
members = [
    ".",
    ".",
    ".",
    ".",
    ".",
    ".",
]

[tool.uv.sources]
mtree = { workspace = true }

[tool.ruff]
# Target specific Python versions
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# Enable specific rule categories (e.g., Pyflakes, Rule Errors, isort, Upgrades)
select = ["F", "E", "W", "I", "UP"]

# Ignore pedantic rules that conflict with your coding style
ignore = ["E501"]

[dependency-groups]
dev = [
    "mtree",
]
