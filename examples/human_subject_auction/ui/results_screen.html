<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .auction-card {
            max-width: 800px;
            margin: 40px auto;
        }
        .info-panel {
            background-color: #f1f3f5;
            border-left: 5px solid #0d6efd;
        }
        .bid-input {
            font-size: 1.5rem;
        }
        .status-log {
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
<script type="module">
      import { Application, Controller } from "https://unpkg.com/@hotwired/stimulus/dist/stimulus.js"
      window.Stimulus = Application.start()
      Stimulus.register("results-screen-controller", class extends Controller {
        static targets = [ "endowment", "estimated-error", "estimated-value",  ]

        connect() {
          console.log("ALKFJ")
        }
      })
  </script>
    <div class="results-screen">
        <div class="auction-card card shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0 text-center">Human Subject Auction Experiment</h3>
            </div>
            
            <div class="card-body">
                <div class="row">
                    <!-- Information Panel -->
                    <div class="col-lg-5 mb-4">
                        <div class="info-panel p-4 rounded">
                            <h5 class="mb-3">Your Information</h5>
                            
                            <div class="mb-3">
                                <strong>Endowment:</strong>
                                <span id="endowment" class="fs-4 text-success">{{endowment}}</span>
                            </div>
                                                        
                            
                        </div>
                    </div>
                    
                    <!-- Results Area -->
                    <div class="col-lg-7">
                        <div class="card h-100">
                            <div class="card-body">
                                <h4 class="card-title text-center mb-4">Your result: </h4>
                                
                                <div class="mb-4">
                                    <label for="bid-input" class="form-label fw-bold">{{result_message}}</label>
                                    
                                </div>
                                
                                
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </div>


</body>
</html>
