<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .auction-card {
            max-width: 800px;
            margin: 40px auto;
        }
        .info-panel {
            background-color: #f1f3f5;
            border-left: 5px solid #0d6efd;
        }
        .bid-input {
            font-size: 1.5rem;
        }
        .status-log {
            max-height: 200px;
            overflow-y: auto;
        }
    </style>

    <div id="bidding-screen" data-controller="biddingScreen">
        <div class="auction-card card shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0 text-center">Human Subject Auction Experiment</h3>
            </div>
            
            <div class="card-body">
                <div class="row">
                    <!-- Information Panel -->
                    <div class="col-lg-5 mb-4">
                        <div class="info-panel p-4 rounded">
                            <h5 class="mb-3">Your Information</h5>
                            
                            <div class="mb-3">
                                <strong>Endowment:</strong>
                                <span id="endowment" class="fs-4 text-success" data-biddingScreen-target="endowment">{{ endowment}}</span>
                            </div>
                            
                            <div class="mb-3">
                                <strong>Estimate of Value:</strong>
                                <span id="estimated-value" class="fs-4">{{value_estimate}}</span>
                            </div>
                            
                            <div class="mb-3">
                                <strong>Estimate Error:</strong>
                                <span id="estimated-error" class="fs-4">{{ estimate_error}}</span>
                            </div>
                            

                        </div>
                    </div>
                    
                    <!-- Bidding Area -->
                    <div class="col-lg-7">
                        <div class="card h-100">
                            <div class="card-body">
                                <h4 class="card-title text-center mb-4">Place Your Bid</h4>
                                
                                <div class="mb-4">
                                    <label for="bid-input" class="form-label fw-bold">Your Bid Amount ($)</label>
                                    <div class="input-group input-group-lg">
                                        <span class="input-group-text">$</span>
                                        <input type="number" 
                                               id="bidInput" 
                                               class="form-control bid-input text-center"
                                               placeholder="0"
                                               min="0"
                                               step="1"
                                               data-biddingScreen-target="bidInput"
                                               data-action="input->biddingScreen#bid_value_update">
                                    </div>
                                </div>
                                
                                <div class="d-grid">
                                    <button id="bid-button" 
                                            class="btn btn-success btn-lg py-3"
                                            data-biddingScreen-target="submitBidButton"                                        
                                            data-action="click->biddingScreen#submit_bid">
                                        <strong>SUBMIT BID</strong>
                                    </button>
                                </div>
                                
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
<script type="module">
    console.log("Loaded the next javascript....");
      import { Application, Controller } from "https://unpkg.com/@hotwired/stimulus/dist/stimulus.js"
      Stimulus.register("biddingScreen", class extends Controller {
        static targets = [ "endowment", "estimatedError", "estimatedValue", "bidInput", "submitBidButton"  ]

        connect() {
          console.log("ALKFJ")
        }

        bid_value_update(event){
            var endowmentValue = parseInt(this.endowmentTarget.textContent, 10);
            var bidValue = parseInt(this.bidInputTarget.value, 10);
            if (bidValue < 0) {
                this.bidInputTarget.value = 0;
            }
            if (bidValue > endowmentValue) {
                this.bidInputTarget.value = endowmentValue;
            } 
        }

        submit_bid(event){
            var bidValue = parseInt(this.bidInputTarget.value, 10);
            this.submitBidButtonTarget.disabled = true;
            this.bidInputTarget.disabled = true;
            const payload = {
                bid: bidValue,
                action: "subject_action",
                directive: "submit_bid"
            };

            window.globalWS.send(JSON.stringify(payload));
            
        }
      })
  </script>

</body>
</html>
