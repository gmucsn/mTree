<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="Mark Otto, Jacob Thornton, and Bootstrap contributors">
    <meta name="generator" content="Hugo 0.98.0">
    <title>mTree - Subject Interface Landing Server</title>

    <script src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8.0.23/dist/turbo.es2017-umd.min.js"></script>
    <script>Turbo.connectStreamSource(new WebSocket(`ws://127.0.0.1:8000/subject/turbo-stream`));</script>
    <script>            
            var ws = new WebSocket(`ws://127.0.0.1:8000/subject/experiment_ws`);
            ws.onmessage = function(event) {
                  var messages = document.getElementById('messages')
                  var message = document.createElement('li')
                  var content = document.createTextNode(event.data)
                  message.appendChild(content)
                  messages.appendChild(message)
            };
    </script>
    <script type="module">
      import { Application, Controller } from "https://unpkg.com/@hotwired/stimulus/dist/stimulus.js"
      window.Stimulus = Application.start()
      Stimulus.register("subject-controller", class extends Controller {
        static targets = [ "name" ]

        connect() {
          console.log("ALKFJ")
        }
      })
  </script>
    <!-- Bootstrap core CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Custom styles for this template -->
    <link href="https://getbootstrap.com/docs/5.3/examples/dashboard/dashboard.css" rel="stylesheet">

    
  </head>
  <body>
    
      <nav class="navbar navbar-expand-lg fixed-top navbar-light bg-light">
        <div class="container-fluid">
          
          <div class="collapse navbar-collapse justify-content-md-center" id="navbarsExample08" data-controller="subject-controller">
            <ul class="navbar-nav">
              <li class="nav-item">
                mTree Subject Interface - <span id="global-experiment-name"></span> - Subject ID: 
                <span id="global-subject-id">{% if subject_id %}
                  {{ subject_id }}
              {% endif %}</span>- Total Earnings: <span class="outlet" id="global_total_earnings" data-outlet-value="global_total_earnings"></span>
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <main class="container">
        <turbo-frame id="subject_screen_container">
        {% block content %}
                 
        {% endblock %}
        </turbo-frame>
      </main>
