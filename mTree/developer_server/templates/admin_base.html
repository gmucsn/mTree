  <script src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8.0.23/dist/turbo.es2017-umd.min.js"></script>
  <script>Turbo.connectStreamSource(new WebSocket(`ws://127.0.0.1:8000/admin/turbo-stream`));</script>
  <script>            var ws = new WebSocket(`ws://127.0.0.1:8000/admin/experiment_ws`);
            ws.onmessage = function(event) {
                var messages = document.getElementById('messages')
                var message = document.createElement('li')
                var content = document.createTextNode(event.data)
                message.appendChild(content)
                messages.appendChild(message)
            };</script>
